[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-sim"
version = "0.1.0"
description = "DSH 工业仿真智能体首版（R0）：STAR-CCM+ 缓冲腔任务族 工程服务 + MCP 工具 + 工作台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
# MCP server 依赖独立成 extra：fastmcp 4.x 强制 mcp>=2，与共享 env 中
# medini/catia 等 mcp 1.x 服务冲突，故 MCP server 跑独立 venv（envs/dsh-sim）。
mcp = ["fastmcp>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "coverage>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

# 包内非 .py 资源必须显式声明，否则 wheel 里没有它们（上游验收报告 §五：
# 旧产物 55 个文件全是 .py，报告模板 / 规则 / 面板完全缺失）。
[tool.setuptools.package-data]
dsh_sim = ["evidence/templates/*.j2"]

[tool.pytest.ini_options]
markers = [
    "mock: Mock 层测试（默认全绿线，不需真实软件/网络）",
    "real_solver: 需要真实 STAR-CCM+ 的测试（未执行记 NOT_RUN）",
    "integration: 服务级集成测试（SQLite 开发库）",
]
addopts = "-m 'not real_solver'"
testpaths = ["tests"]
